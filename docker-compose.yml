# Local PostgreSQL and Redis for development:   docker compose up -d db redis
# Whole stack (app + db + redis):               docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: imm
      POSTGRES_PASSWORD: imm_dev_pw
      POSTGRES_DB: iammendexmendle
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imm -d iammendexmendle"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://imm:imm_dev_pw@db:5432/iammendexmendle
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8000:8000"]
volumes:
  pgdata:
