{% extends "public/base.html" %}
{% block title %}Something went wrong – {{ biz }}{% endblock %}
{% block content %}
<section class="py-20"><div class="mx-auto max-w-xl px-5 text-center">
  <p class="font-display text-6xl font-extrabold text-brand-red">500</p>
  <h1 class="mt-4 text-3xl font-bold">Something went wrong on our side</h1>
  <p class="mt-3 text-brand-muted">We have logged the problem. Please try again in a moment.{% if request_id %} Reference: <b>{{ request_id }}</b>.{% endif %}</p>
  <p class="mt-8"><a href="/" class="btn">Home</a></p>
</div></section>
{% endblock %}
